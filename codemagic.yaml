workflows:
  build-ipa:
    name: Build IPA (unsigned)
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - |
        xcodebuild -project StepsWrite.xcodeproj \
          -scheme StepsWrite \
          -configuration Release \
          -sdk iphoneos \
          -archivePath /tmp/StepsWrite.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY=""
      - |
        mkdir -p /tmp/Payload
        cp -R /tmp/StepsWrite.xcarchive/Products/Applications/* /tmp/Payload/
        cd /tmp
        zip -r /tmp/StepsWrite.ipa Payload/
    artifacts:
      - /tmp/StepsWrite.ipa
    publishing:
      email:
        recipients:
          - lozegerard28@gmail.com
