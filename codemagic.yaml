workflows:
  build-ipa:
    name: Build IPA (unsigned)
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - |
        xcodebuild -project StepsWrite.xcodeproj \
          -scheme StepsWrite \
          -configuration Release \
          -sdk iphoneos \
          -archivePath /tmp/StepsWrite.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY=""
      - |
        xcodebuild -exportArchive \
          -archivePath /tmp/StepsWrite.xcarchive \
          -exportPath /tmp/export \
          -exportOptionsPlist $CM_BUILD_DIR/StepsWrite/export.plist
    artifacts:
      - /tmp/export/*.ipa
    publishing:
      email:
        recipients:
          - lozegerard28@gmail.com
